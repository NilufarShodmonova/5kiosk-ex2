<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DU-26A — Tirkamali katok · Прицепной каток · Towed roller</title>
<style>
:root{--n9:#070d18;--n8:#0b1526;--n7:#101f38;--n6:#16294a;--line:rgba(212,175,110,.34);--line-s:rgba(212,175,110,.16);
--g:#d8b26c;--gh:#f2dda8;--gd:#b98f45;--gp:#f0d9a8;--sand:#e9dcc4;--tx:#dfd4bf;--dim:rgba(223,212,191,.68);
--disp:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;--body:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;
--sh:0 1.2rem 3rem rgba(0,0,0,.55);--e:cubic-bezier(.22,.9,.28,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(0.55vw + 0.55vh)}
body{font-family:var(--body);background:var(--n9);color:var(--tx);height:100vh;width:100vw;overflow:hidden;user-select:none;-webkit-user-select:none}
img{display:block}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;z-index:1}
.scr.on{opacity:1;visibility:visible;z-index:5}
/* bg */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(130% 95% at 50% 0%,#14263f 0%,#0a1120 58%,#070d18 100%)}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;transform:scale(1.04);transition:opacity 1s,filter 1s}
.bg.contain img{object-fit:contain;padding:22vh 6vw 20vh;opacity:.75;transform:none;filter:drop-shadow(0 4vh 8vh rgba(0,0,0,.7))}
.bg svg{position:absolute;left:50%;top:50%;width:60vw;transform:translate(-50%,-50%);opacity:.85}
.bg .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,13,24,.55) 0%,rgba(7,13,24,.10) 34%,rgba(7,13,24,.40) 66%,rgba(7,13,24,.90) 100%)}
.bg .grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.25) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px)}
body.inner .bg img{opacity:.22;filter:blur(2px) saturate(.8)}body.inner .bg svg{opacity:.12}
body.inner .bg .veil{background:linear-gradient(180deg,rgba(5,10,20,.6) 0%,rgba(6,12,22,.85) 40%,rgba(5,10,20,.96) 100%)}
/* splash */
#splash{padding:2rem 3rem 3rem;align-items:center;text-align:center}
.top{display:flex;align-items:center;gap:2rem;width:100%;padding:1.4rem 2.8rem;background:linear-gradient(135deg,rgba(16,31,56,.78),rgba(11,22,40,.62) 50%,rgba(7,14,26,.85));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(212,175,110,.35);border-radius:1.6rem;box-shadow:0 1rem 3rem rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.12);animation:fdown .9s .1s both;flex-shrink:0}
.logo{width:7.5rem;height:auto;flex:0 0 auto;filter:drop-shadow(0 .6rem 1.6rem rgba(0,0,0,.75))}
.org{text-align:left;font-size:1.45rem;line-height:1.4;letter-spacing:.12em;color:var(--sand);text-transform:uppercase;font-weight:500}
.org b{display:block;font-family:var(--disp);font-weight:700;color:var(--gh);font-size:1.3em;line-height:1.3;letter-spacing:.18em;margin-top:.4rem;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.mid{padding:6rem 12rem;border-radius:50%;background:radial-gradient(ellipse at center,rgba(7,13,24,.88) 0%,rgba(7,13,24,.55) 45%,transparent 72%);display:flex;flex-direction:column;align-items:center;gap:.6rem;flex:1;justify-content:center;animation:fup 1s .5s both}
.hero{font-family:var(--disp);font-weight:700;font-size:7.6rem;line-height:1.02;letter-spacing:.07em;background:linear-gradient(180deg,#fbfbfb 0%,#fff5e3 45%,#ffc257 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .4rem 1.2rem rgba(0,0,0,.8))}
.hero-sup{font-family:var(--disp);font-weight:600;font-size:2.2rem;letter-spacing:.42em;color:var(--sand);text-transform:uppercase;padding-left:.42em;text-shadow:0 .15rem .3rem rgba(0,0,0,.45)}
.hero-sub{font-family:var(--disp);font-weight:600;font-size:2.6rem;letter-spacing:.34em;color:var(--gh);text-transform:uppercase;margin-top:.6rem;padding-left:.34em;text-shadow:0 .15rem .3rem rgba(0,0,0,.45)}
.hero-sub small{display:block;font-size:.62em;letter-spacing:.3em;color:var(--sand);opacity:.85;margin-top:.5rem}
.bot{display:flex;flex-direction:column;align-items:center;gap:1.4rem;width:100%;margin-top:auto;padding-top:.8rem}
.choose{font-size:1.24rem;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);animation:fup 1s .7s both}
.langs{display:flex;gap:2.4rem;justify-content:center;width:100%}
.lang{position:relative;width:16.5rem;height:12.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(16,31,56,.62),rgba(8,15,28,.82));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:8.2rem 8.2rem 1.2rem 1.2rem;box-shadow:var(--sh),inset 0 0 4rem rgba(216,178,108,.06);transition:transform .28s cubic-bezier(.2,.9,.3,1.2),box-shadow .28s,border-color .28s;animation:fup .9s both}
.lang:nth-child(1){animation-delay:.85s}.lang:nth-child(2){animation-delay:.97s}.lang:nth-child(3){animation-delay:1.09s}
.lang:active{transform:scale(.965)}.lang:hover{border-color:rgba(212,175,110,.85);box-shadow:0 1.4rem 3.6rem rgba(0,0,0,.6),0 0 3rem rgba(216,178,108,.22),inset 0 0 4rem rgba(216,178,108,.12)}
.lang b{font-family:var(--disp);font-weight:700;font-size:3.3rem;letter-spacing:.14em;color:var(--gh);padding-top:1.6rem}
.lang i{width:5rem;height:1px;background:var(--line);margin:.6rem 0 .2rem}
.lang span{font-size:1.24rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
@keyframes fup{from{opacity:0;transform:translateY(3.2rem)}to{opacity:1;transform:none}}
@keyframes fdown{from{opacity:0;transform:translateY(-2.4rem)}to{opacity:1;transform:none}}
/* inner head */
.head{display:flex;align-items:center;gap:2.2rem;padding:1.6rem 3.4rem;border-bottom:1px solid rgba(212,175,110,.35);background:linear-gradient(135deg,rgba(16,31,56,.9),rgba(11,22,40,.85) 50%,rgba(7,14,26,.95));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1rem 3rem rgba(0,0,0,.5);flex:0 0 auto;z-index:50;position:relative}
.head .logo{width:5.4rem}.head .txt{flex:1;min-width:0;text-align:left}
.head .o{font-family:var(--disp);font-size:1.02rem;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);line-height:1.7}
.head .nm{font-family:var(--disp);font-size:1.9rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gh);margin-top:.3rem;font-weight:700}
.tools{display:flex;align-items:center;gap:1rem}
.pill{padding:.85rem 1.6rem;border:1px solid var(--line);border-radius:.5rem;font-size:1.12rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);transition:all .25s}
.pill.on{color:var(--n9);background:linear-gradient(180deg,var(--gh),var(--gd));border-color:transparent;font-weight:600}.pill:active{transform:scale(.94)}
.ico{width:5.4rem;height:5.4rem;border:1px solid var(--line);border-radius:.6rem;display:flex;align-items:center;justify-content:center;transition:all .25s;margin-left:1rem}
.ico svg{width:2.4rem;height:2.4rem;stroke:var(--g);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ico:hover{border-color:var(--g);background:rgba(216,178,108,.09)}
/* page */
#page{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;position:relative}
#page::-webkit-scrollbar{width:0}
section{padding:6vh 5vw;position:relative}
h2{font-family:var(--disp);font-size:clamp(28px,2.8vw,50px);font-weight:700;color:var(--gp);margin-bottom:3.4vh;display:flex;align-items:center;gap:1.6vw}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
/* hero */
.hero-s{min-height:calc(100vh - 9rem);display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:3vw;padding:5vh 5vw 4vh}
.kick{font-size:clamp(11px,.95vw,17px);letter-spacing:.42em;text-transform:uppercase;color:var(--g);margin-bottom:2.4vh;opacity:0;animation:up .9s .2s forwards}
h1{font-family:var(--disp);font-size:clamp(64px,7vw,124px);line-height:.95;font-weight:700;overflow:hidden}
h1 span{display:block;transform:translateY(110%);animation:rise 1s var(--e) forwards}
h1 .m{color:var(--gp)}h1 .k{font-size:.42em;font-weight:600;color:var(--sand);letter-spacing:.2em;text-transform:uppercase;animation-delay:.25s;margin-top:1.4vh}
.sweep{height:1px;width:0;background:linear-gradient(90deg,var(--gd),var(--gh) 60%,transparent);margin:3.4vh 0 2.6vh;box-shadow:0 0 14px rgba(227,178,94,.6);animation:sweep 1.4s .7s var(--e) forwards}
.tag{font-size:clamp(18px,1.5vw,28px);color:#dcd6c8;font-weight:300;opacity:0;animation:up 1s 1s forwards;line-height:1.5}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:2.2vh 2vw;margin-top:4.4vh}
.facts div{opacity:0;animation:up .8s forwards;border-left:1px solid var(--line);padding-left:1.2vw}
.facts small{display:block;font-size:clamp(10px,.8vw,14px);letter-spacing:.3em;text-transform:uppercase;color:var(--g);margin-bottom:.8vh}
.facts b{font-family:var(--disp);font-size:clamp(18px,1.6vw,30px);font-weight:600;color:#f5eedf;line-height:1.2}
.facts .num{font-family:var(--disp);font-size:clamp(44px,3.8vw,72px);font-weight:700;color:var(--gp);line-height:1}
.facts .num i{font-style:normal;font-size:.36em;color:var(--sand);font-weight:500;margin-left:.6vw;letter-spacing:.2em;text-transform:uppercase}
.v{position:relative;height:70vh;display:flex;align-items:center;justify-content:center}
.v img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:var(--fit);border-radius:1.2rem;opacity:0;transform:scale(1.08) translateX(30px);animation:kb 1.6s .3s var(--e) forwards;filter:drop-shadow(0 4vh 6vh rgba(0,0,0,.6))}
.v.cover img{border:1px solid var(--line)}
.v svg{width:92%;height:auto}
.draw path,.draw circle{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.2s cubic-bezier(.4,0,.2,1) forwards}
.draw .d2 *{animation-delay:.6s}.draw .d3 *{animation-delay:1.2s}.draw .d4 *{animation-delay:1.8s}.draw .d5 *{animation-delay:1.5s}
.scroll{position:absolute;bottom:2vh;left:50%;transform:translateX(-50%);font-size:clamp(10px,.8vw,13px);letter-spacing:.3em;color:var(--dim);text-transform:uppercase;opacity:0;animation:up 1s 2.2s forwards}
.scroll::after{content:"";display:block;width:1px;height:3vh;background:var(--g);margin:1vh auto 0;animation:pulse 1.6s infinite}
/* lead */
.lead{display:grid;grid-template-columns:1.2fr 1fr;gap:5vw}
.lead .big{font-family:var(--disp);font-size:clamp(22px,2vw,38px);line-height:1.4;color:#f5eedf}
.lead .side p{font-size:clamp(14px,1.15vw,22px);line-height:1.6;color:#cfc7b6;margin-bottom:2.2vh;padding-left:1.4vw;border-left:1px solid var(--line-s)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw}
.card{background:linear-gradient(170deg,rgba(22,41,74,.7),rgba(11,21,38,.9));border:1px solid var(--line);border-radius:1.4rem;overflow:hidden;box-shadow:var(--sh);transition:border-color .3s}
.card:hover{border-color:rgba(212,175,110,.8)}
.card .ph{height:24vh;background:#0a1320;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s}.card:hover .ph img{transform:scale(1.06)}
.card .ph.ct img{object-fit:contain;background:linear-gradient(180deg,#f4efe4,#e6dfd0);padding:1vh}
.card .ph .ico2{font-family:var(--disp);font-size:clamp(50px,5vw,90px);font-weight:700;color:var(--g);opacity:.7}
.card .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(11,21,38,.9))}
.card .b{padding:2.4vh 1.4vw 3vh}
.card h3{font-family:var(--disp);font-size:clamp(16px,1.35vw,26px);letter-spacing:.1em;text-transform:uppercase;color:var(--gh);margin-bottom:1.2vh}
.card p{font-size:clamp(13px,1.05vw,19px);line-height:1.5;color:#cfc7b6}
/* specs */
.specs{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:4vw;align-items:start}
.specs h3{font-family:var(--disp);font-size:clamp(16px,1.4vw,26px);letter-spacing:.14em;text-transform:uppercase;color:var(--sand);margin-bottom:2vh}
.specs ul{list-style:none}
.specs li{font-size:clamp(14px,1.2vw,22px);color:#eae4d6;padding:1.2vh 0 1.2vh 26px;border-bottom:1px dashed var(--line-s);position:relative;line-height:1.45}
.specs li::before{content:"";position:absolute;left:0;top:calc(1.2vh + .5em);width:9px;height:9px;border:1.5px solid var(--g);transform:rotate(45deg)}
.bar{margin-bottom:2.2vh}.bar .l{display:flex;justify-content:space-between;gap:1vw;font-size:clamp(13px,1.05vw,19px);color:#cfc7b6;margin-bottom:.8vh}.bar .l b{color:var(--gp);font-family:var(--disp);font-size:1.25em;font-weight:600;text-align:right}
.bar .tr{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}.bar .fl{height:100%;width:0;background:linear-gradient(90deg,var(--gd),var(--gh));box-shadow:0 0 12px rgba(227,178,94,.55);transition:width 1.4s var(--e)}
.on .bar .fl{width:var(--w)}
.dims{display:flex;gap:1.2vw;flex-wrap:wrap}
.dim{border:1px solid var(--line);border-radius:1.2rem;padding:2vh 1.6vw;min-width:10vw;background:linear-gradient(170deg,rgba(22,41,74,.7),rgba(11,21,38,.85))}
.dim b{display:block;font-family:var(--disp);font-size:clamp(32px,3vw,56px);font-weight:700;color:var(--gp);line-height:1}.dim small{font-size:clamp(10px,.8vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--g)}
/* uses */
.uses{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw;list-style:none;counter-reset:n}
.uses li{counter-increment:n;background:linear-gradient(170deg,rgba(22,41,74,.55),rgba(11,21,38,.8));border:1px solid var(--line-s);border-radius:1rem;padding:2vh 1.4vw;font-size:clamp(14px,1.2vw,22px);display:flex;align-items:center;gap:1vw;color:#f0ead9}
.uses li::before{content:counter(n,decimal-leading-zero);font-family:var(--disp);font-size:1.3em;color:var(--g);letter-spacing:.06em;flex:none}
/* timeline */
.tl{position:relative;padding-top:3vh}
.tl .track{position:absolute;left:0;right:0;top:3vh;height:1px;background:var(--line-s)}
.tl .prog{position:absolute;left:0;top:3vh;height:1px;width:0;background:linear-gradient(90deg,var(--gd),var(--gh));box-shadow:0 0 12px rgba(227,178,94,.6);transition:width 3s linear}
.on.tl .prog{width:100%}
.tl .row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.4vw}
.tl .it{padding-top:2.6vh;position:relative}
.tl .it::before{content:"";position:absolute;top:-6px;left:0;width:12px;height:12px;border-radius:50%;background:var(--n9);border:1.5px solid var(--g)}
.tl .it.hl::before{background:var(--gh);box-shadow:0 0 0 6px rgba(216,178,108,.2)}
.tl .it b{display:block;font-family:var(--disp);font-size:clamp(18px,1.7vw,32px);font-weight:700;margin-bottom:1vh;color:var(--gp)}.tl .it.hl b{color:#fff}
.tl .it p{font-size:clamp(12px,1vw,18px);line-height:1.45;color:#cfc7b6}
/* footer */
footer{padding:4vh 5vw 6vh;border-top:1px solid var(--line-s);display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:clamp(12px,1vw,17px);letter-spacing:.1em}
footer .lg{display:flex;align-items:center;gap:1.2vw;color:var(--sand);font-family:var(--disp);font-size:clamp(14px,1.2vw,22px);letter-spacing:.2em;text-transform:uppercase}
footer .lg img{width:4.4rem}
/* reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s var(--e),transform .9s var(--e)}.rv.on{opacity:1;transform:none}
@keyframes up{to{opacity:1;transform:none}}@keyframes rise{to{transform:none}}@keyframes sweep{to{width:22vw}}@keyframes kb{to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media (max-aspect-ratio:1/1){
 .hero{font-size:6rem}.langs{gap:1.6rem}.lang{width:15rem;height:12rem}
 .hero-s{grid-template-columns:1fr;min-height:0}.v{height:44vh}.lead{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.specs{grid-template-columns:1fr}
 .uses{grid-template-columns:1fr 1fr}.tl .row{grid-auto-flow:row;grid-template-columns:1fr 1fr;row-gap:4vh}.tl .track,.tl .prog{display:none}.tl .it{padding-left:24px;padding-top:0}.tl .it::before{top:.5em}
